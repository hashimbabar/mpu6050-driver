name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests (gcc, address + UB sanitizers)
        run: make test
      - name: build the Linux example
        run: make example-linux
      - name: install arm-none-eabi-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: cross-compile for Cortex-M4
        run: make cross
